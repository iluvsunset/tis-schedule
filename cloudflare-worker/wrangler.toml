name = "tis-schedule-sync"
main = "src/index.js"
compatibility_date = "2024-01-01"

# ⏰ Cron Trigger: Runs automatically every 15 minutes (100% Free on Cloudflare)
[triggers]
crons = ["*/15 * * * *"]

# 📦 Cloudflare KV Namespace for storing schedule hashes and subscriber push tokens
# Run `npx wrangler kv:namespace create SCHEDULE_KV` to create your KV and paste the id below:
[[kv_namespaces]]
binding = "SCHEDULE_KV"
id = "SCHEDULE_KV_ID_HERE"

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true
persist = true
